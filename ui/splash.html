<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>말끔이</title>
<style>
/* 스플래시 — 아이콘이 천천히 떠올랐다가(페이드인) 본창이 준비되면 같이 사라진다 */
html,body{margin:0;height:100%;background:#171b26;overflow:hidden;border-radius:16px}
#box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
img{width:300px;height:300px;border-radius:24px;opacity:0;transform:scale(.94);
  animation:rise 1.1s ease-out .05s forwards}
#name{font-family:'Segoe UI','Malgun Gothic',sans-serif;color:#dfe4ee;font-size:18px;font-weight:700;
  letter-spacing:1px;opacity:0;animation:rise .8s ease-out .5s forwards}
@keyframes rise{to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="box"><img src="splash.png" alt=""><div id="name">말끔이</div></div>
</body>
</html>
